<!DOCTYPE html>
<!-- Define o documento como HTML5 -->

<html lang="pt-br">
<!-- Define o idioma da página como português do Brasil -->

<head>
  <!-- Configurações da página -->

  <meta charset="UTF-8" />
  <!-- Permite o uso correto de caracteres especiais -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Adapta a página para diferentes tamanhos de tela -->

  <title>Cabine — catálogo de filmes</title>
  <!-- Título exibido na aba do navegador -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Importa as fontes utilizadas na página -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />

  <!-- Conecta o arquivo de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Elemento decorativo semelhante a uma tira de filme -->
  <div class="tira-perfurada" aria-hidden="true"></div>

  <!-- Container principal da aplicação -->
  <div class="app">

    <!-- Área lateral para cadastrar os filmes -->
    <aside class="cabine">

      <!-- Cabeçalho da cabine -->
      <div class="cabine-topo">

        <!-- Ícone do projetor -->
        <img
          class="icone-projetor"
          alt="Ícone de um projetor de cinema"
          src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='16' cy='32' r='13' fill='none' stroke='%23E8B64C' stroke-width='3'/%3E%3Ccircle cx='16' cy='32' r='4' fill='%23E8B64C'/%3E%3Crect x='28' y='22' width='20' height='20' rx='2' fill='%23C8102E'/%3E%3Cpath d='M48 27l10-6v22l-10-6z' fill='%23E8B64C'/%3E%3C/svg%3E"
        />

        <h1>Cabine</h1>
      </div>

      <!-- Texto explicativo -->
      <p class="subtitulo">
        Todo filme que passa por aqui ganha um cartaz na parede da sala. 
        Preencha os dados da sessão ao lado.
      </p>

      <!-- Campo para informar o título do filme -->
      <div class="campo">
        <label for="input-titulo">Título</label>

        <input 
          type="text" 
          id="input-titulo" 
          placeholder="Ex.: Cidade de Deus" 
        />
      </div>

      <!-- Campos de ano e gênero -->
      <div class="campo-linha">

        <div class="campo">
          <label for="input-ano">Ano</label>

          <!-- Lista de anos preenchida pelo JavaScript -->
          <select id="input-ano" required>
            <option value="" disabled selected>Selecione</option>
          </select>
        </div>

        <div class="campo">
          <label for="input-genero">Gênero</label>

          <!-- Lista para selecionar o gênero do filme -->
          <select id="input-genero">
            <option value="" disabled selected>Selecione</option>
            <option value="Drama">Drama</option>
            <option value="Comédia">Comédia</option>
            <option value="Ação">Ação</option>
            <option value="Ficção Científica">Ficção Científica</option>
            <option value="Terror">Terror</option>
            <option value="Romance">Romance</option>
            <option value="Suspense">Suspense</option>
            <option value="Animação">Animação</option>
            <option value="Aventura">Aventura</option>
            <option value="Documentário">Documentário</option>
          </select>
        </div>

      </div>

      <!-- Sistema de classificação por estrelas -->
      <div class="campo">
        <label>Classificação</label>

        <div class="estrelas" id="estrelas">

          <!-- Cada botão representa uma nota de 1 a 5 -->
          <button type="button" class="estrela" data-valor="1">★</button>
          <button type="button" class="estrela" data-valor="2">★</button>
          <button type="button" class="estrela" data-valor="3">★</button>
          <button type="button" class="estrela" data-valor="4">★</button>
          <button type="button" class="estrela" data-valor="5">★</button>

        </div>
      </div>

      <!-- Botão para adicionar o filme ao catálogo -->
      <button id="btn-adicionar">Exibir na sala</button>

      <!-- Área onde serão exibidas mensagens de erro -->
      <p class="erro" id="mensagem-erro"></p>

      <!-- Informações sobre os filmes cadastrados -->
      <div class="stats">

        <!-- Contador de filmes -->
        <p>
          <span id="contador">0</span> filme(s) em cartaz
        </p>

        <!-- Informação sobre o último filme adicionado -->
        <p class="stats-sub" id="ultimo-filme">
          A sala ainda está vazia. Anuncie a primeira sessão.
        </p>

      </div>

    </aside>

    <!-- Área principal onde os cartazes serão exibidos -->
    <main class="sala">

      <!-- Os filmes serão adicionados aqui pelo JavaScript -->
      <div class="cartazes" id="cartazes"></div>

    </main>

  </div>

  <!-- Elemento decorativo inferior -->
  <div class="tira-perfurada" aria-hidden="true"></div>

  <!-- Conecta o arquivo JavaScript responsável pela funcionalidade -->
  <script src="script.js"></script>

</body>

</html>
```
